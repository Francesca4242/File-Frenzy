  <ellipse cx="118" cy="112" rx="58" ry="44" fill="#a7adb5"/>
  <ellipse cx="122" cy="124" rx="36" ry="24" fill="#c9cdd3"/>
  <!-- head -->
  <circle cx="72" cy="88" r="40" fill="#b4bac2"/>
  <!-- ears -->
  <circle cx="44" cy="52" r="24" fill="#b4bac2"/>
  <circle cx="44" cy="52" r="15" fill="#f4b6c6"/>
  <circle cx="98" cy="46" r="26" fill="#b4bac2"/>
  <circle cx="98" cy="46" r="17" fill="#f4b6c6"/>
  <!-- face -->
  <circle cx="58" cy="86" r="7" fill="#1b1b1f"/>
  <circle cx="84" cy="84" r="7" fill="#1b1b1f"/>
  <circle cx="60" cy="83" r="2.4" fill="#fff"/>
  <circle cx="86" cy="81" r="2.4" fill="#fff"/>
  <ellipse cx="50" cy="100" rx="7" ry="4" fill="#f4b6c6" opacity=".8"/>
