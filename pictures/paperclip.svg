  <circle cx="65" cy="92" r="6" fill="#1b1b1f"/>
  <circle cx="101" cy="92" r="6" fill="#1b1b1f"/>
  <circle cx="67" cy="89" r="2" fill="#fff"/>
  <circle cx="103" cy="89" r="2" fill="#fff"/>
  <path d="M52 66q10-6 20 0M88 66q10-6 20 0" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <!-- feet -->
  <ellipse cx="52" cy="226" rx="16" ry="7" fill="#9aa0a6"/>
  <ellipse cx="112" cy="226" rx="16" ry="7" fill="#9aa0a6"/>
  <path d="M60 200v20M124 184v36" stroke="#b9c0c8" stroke-width="6" stroke-linecap="round"/>
