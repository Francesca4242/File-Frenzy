  <g transform="translate(80 30)">
    <circle r="22" fill="#ffe46b" opacity=".35"/>
    <path d="M0-16a13 13 0 0 1 8 23v5h-16v-5A13 13 0 0 1 0-16z" fill="#ffe46b" stroke="#b08a00" stroke-width="2"/>
    <rect x="-7" y="13" width="14" height="6" rx="2" fill="#9aa0a6"/>
  </g>
  <!-- paperclip wire -->
  <path d="M60 200V96a20 20 0 0 1 40 0v96a32 32 0 0 1-64 0V84a44 44 0 0 1 88 0v100" fill="none" stroke="#b9c0c8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- rust spots -->
