<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 190" role="img" aria-labelledby="t">
  <title id="t">A large mouse with chocolate on its whiskers beside an empty tub of hot chocolate</title>
  <!-- empty tub, tipped over -->
  <g transform="rotate(-12 215 140)">
    <rect x="178" y="92" width="78" height="86" rx="8" fill="#7a4526"/>
    <rect x="178" y="92" width="78" height="16" rx="6" fill="#5a311a"/>
    <rect x="186" y="118" width="62" height="34" rx="4" fill="#f6e7c9"/>
    <text x="217" y="140" font-family="Georgia, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#5a311a">COCOA</text>
  </g>
  <circle cx="196" cy="182" r="3" fill="#6b3a1f"/><circle cx="210" cy="185" r="2" fill="#6b3a1f"/><circle cx="170" cy="184" r="2.5" fill="#6b3a1f"/>
  <!-- tail -->
  <path d="M150 150c26 6 34-12 26-24" fill="none" stroke="#e8a4b4" stroke-width="7" stroke-linecap="round"/>
  <!-- big round body -->
  <ellipse cx="100" cy="128" rx="66" ry="54" fill="#a7adb5"/>
  <ellipse cx="102" cy="142" rx="44" ry="30" fill="#c9cdd3"/>
  <!-- head -->
  <circle cx="84" cy="82" r="42" fill="#b4bac2"/>
  <circle cx="52" cy="46" r="24" fill="#b4bac2"/><circle cx="52" cy="46" r="15" fill="#f4b6c6"/>
  <circle cx="116" cy="42" r="26" fill="#b4bac2"/><circle cx="116" cy="42" r="17" fill="#f4b6c6"/>
  <!-- happy closed eyes -->
  <path d="M62 80q8-8 16 0M92 78q8-8 16 0" fill="none" stroke="#1b1b1f" stroke-width="3.5" stroke-linecap="round"/>
  <!-- chocolate smears -->
  <ellipse cx="84" cy="104" rx="26" ry="12" fill="#6b3a1f" opacity=".9"/>
  <circle cx="60" cy="112" r="5" fill="#6b3a1f"/><circle cx="110" cy="110" r="4" fill="#6b3a1f"/>
  <ellipse cx="84" cy="96" rx="7" ry="6" fill="#e27a93"/>
  <path d="M74 108q10 9 20 0" fill="none" stroke="#1b1b1f" stroke-width="3" stroke-linecap="round"/>
  <!-- chocolatey whiskers -->
  <g stroke="#4a2612" stroke-width="2.5" stroke-linecap="round">
    <path d="M64 100 34 94M64 106 34 110"/><path d="M104 100 134 94M104 106 134 110"/>
  </g>
  <ellipse cx="80" cy="180" rx="16" ry="7" fill="#f4b6c6"/><ellipse cx="124" cy="180" rx="16" ry="7" fill="#f4b6c6"/>
</svg>
